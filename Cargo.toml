[workspace]
resolver = "2"
members = [
  "lumen-cli",
  "lumen-core",
  "lumen-media",
  "lumen-server",
  "lumen-webrtc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# workspace members
lumen-cli = { path = "lumen-cli" }
lumen-core = { path = "lumen-core" }
lumen-media = { path = "lumen-media" }
lumen-server = { path = "lumen-server" }
lumen-webrtc = { path = "lumen-webrtc" }

# external
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
futures-util = "0.3"
getrandom = "0.4"
local-ip-address = "0.6"
mdns-sd = "0.21"
openh264 = "0.9"
qrcode = "0.14"
opus = "0.4"
rtc = "0.20"
rust-embed = "8.12"
# macOS video + system audio: safe ScreenCaptureKit bindings (Swift bridge,
# macOS 13+). The crate pins BGRA output at construction and depends only on
# the thin apple-cf / apple-metal binding crates.
screencapturekit = "10"
# Only for the TCC screen-recording permission gate (preflight/request); the
# `screencapturekit` crate itself has no permission helper.
core-graphics = "0.25"
# Windows video: direct Windows.Graphics.Capture bindings (engine runs on its
# own thread, frames delivered over a bounded channel).
windows-capture = "2"
# Only for tests: constructing `windows::core::Error` (with the exact
# `E_ACCESSDENIED` HRESULT) to pin the elevated-window error mapping.
windows = "0.62"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
  "net",
  "io-util",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.20"

[workspace.lints.rust]
# `deny` (not `forbid`) so the one audited exception — the macOS-only unsafe
# block that reads a locked `CVPixelBuffer`'s pixels (the `apple-cf` guard
# exposes its slice only as an `unsafe fn`) — can carry a scoped `#[expect]`.
# Everything else stays hard-error under `-D warnings`.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
