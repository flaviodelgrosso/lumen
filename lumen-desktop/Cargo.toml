[package]
name = "lumen-desktop"
description = "Lumen Desktop — native menu-bar/system-tray frontend for the Lumen sharing session"
version.workspace = true
edition.workspace = true
# `tray-icon`/`muda` require 1.90; the CLI and core crates keep the workspace MSRV.
rust-version = "1.90"
license.workspace = true

[[bin]]
name = "lumen-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
image.workspace = true
lumen-session.workspace = true
muda.workspace = true
open.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSResponder",
] }

[lints]
workspace = true
